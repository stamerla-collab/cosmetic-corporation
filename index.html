        .tab-bg {
            position: absolute;
            top: 5px;
            left: 5px;
            width: calc(50% - 5px);
            height: calc(100% - 10px);
            background-color: #ffffff;
            border-radius: 50px;

    const priceListEl = document.getElementById('price-list');

    function renderPrices(cityKey) {
      const data = priceData[cityKey];
      let html = '';

      data.forEach(group => {
        html += `<div class="service-group">`;
        html += `<div class="service-header">${group.header}</div>`;

        group.items.forEach(item => {
          html += `
            <div class="service-item">
              <div class="service-name">${item.name}</div>
              <div class="service-price">
                ${item.price}
                ${item.note ? `<span class="service-note">${item.note}</span>` : ''}
              </div>
            </div>
          `;
        });
        html += `</div>`;
      });

      
      priceListEl.classList.add('fade-out');

      setTimeout(() => {
        priceListEl.innerHTML = html;
        priceListEl.classList.remove('fade-out');
        priceListEl.classList.add('fade-in');
      }, 200); 
    }

  
    function switchCity(cityKey, btnElement) {
    
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

    
      if (cityKey === 'makhachkala') {
        tabBg.style.transform = 'translateX(100%)';
      } else {
        tabBg.style.transform = 'translateX(0)';
      }

      
      renderPrices(cityKey);
    }
